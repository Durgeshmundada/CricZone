services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    volumes:
      - criczone-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/criczone
      JWT_SECRET: local-docker-secret-change-before-sharing
      JWT_ACCESS_EXPIRE: 30m
      JWT_REFRESH_EXPIRE_DAYS: 14
      CLIENT_URL: http://localhost:5000
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  criczone-mongo-data:
